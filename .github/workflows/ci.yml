name: "CanbanVoimaxHarness CI"

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: "Verify Frontend & Rust Sensors"
    runs-on: windows-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Setup pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: "Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: "Install Frontend Dependencies"
        run: pnpm install --frozen-lockfile

      - name: "Verify Frontend Bundle Sensor (tsc && vite build)"
        run: pnpm run build

      - name: "Setup Rust Toolchain (stable-msvc)"
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: "Rust Dependency Cache"
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: "Verify Rust Compiler Sensor (cargo check)"
        run: |
          cd src-tauri
          cargo check

      - name: "Verify Rust Clippy Sensor (cargo clippy -- -D warnings)"
        run: |
          cd src-tauri
          cargo clippy -- -D warnings
