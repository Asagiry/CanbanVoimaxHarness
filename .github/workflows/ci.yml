name: "CanbanVoimaxHarness CI & Desktop Release"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: "Build & Verify Windows Desktop Core"
    runs-on: windows-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: "Install Frontend Dependencies"
        run: npm install

      - name: "Verify Frontend Bundle Sensor (tsc && vite build)"
        run: npm run build

      - name: "Setup Rust Toolchain (stable-msvc)"
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: "Rust Dependency Cache"
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: "Verify Rust Compiler Sensor (cargo check)"
        run: |
          cd src-tauri
          cargo check

      - name: "Verify Rust Clippy Sensor (cargo clippy -- -D warnings)"
        run: |
          cd src-tauri
          cargo clippy -- -D warnings

      - name: "Build Native Tauri v2 Desktop Executable"
        run: npm run tauri build

      - name: "Upload Desktop Executable Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: CanbanVoimaxHarness-Windows-x64
          path: |
            src-tauri/target/release/canban-voimax-harness.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
