name: "CanbanVoimaxHarness Release"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""
          - platform: "ubuntu-22.04"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Install dependencies (Linux)"
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev

      - name: "Setup pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: "Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: "Rust setup"
        uses: dtolnay/rust-toolchain@stable

      - name: "Rust Dependency Cache"
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: "Install Frontend Dependencies"
        run: pnpm install --frozen-lockfile

      - name: "Build Tauri App"
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
        with:
          projectPath: .
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}

      - name: "Rename and Prepare Artifacts"
        shell: bash
        run: |
          mkdir -p artifacts-out

          VER_CLEAN="${{ github.ref_name }}"
          VER_CLEAN="${VER_CLEAN#v}"

          # Windows: NSIS setup + portable exe
          if [[ "${{ matrix.platform }}" == *"windows"* ]]; then
            find src-tauri/target -name "*setup.exe" -exec cp {} artifacts-out/CanbanVoimaxHarness_${VER_CLEAN}_x64-setup.exe \; 2>/dev/null || true
            cp src-tauri/target/release/canban-voimax-harness.exe artifacts-out/CanbanVoimaxHarness_${VER_CLEAN}_x64_portable.exe 2>/dev/null || true
          fi

          # Linux: AppImage + deb (bundle targets land here once tauri.conf.json enables them)
          if [[ "${{ matrix.platform }}" == *"ubuntu"* ]]; then
            find src-tauri/target -name "*.AppImage" -exec cp {} artifacts-out/CanbanVoimaxHarness_${VER_CLEAN}_amd64.AppImage \; 2>/dev/null || true
            find src-tauri/target -name "*.deb" -exec cp {} artifacts-out/CanbanVoimaxHarness_${VER_CLEAN}_amd64.deb \; 2>/dev/null || true
          fi

          echo "Contents of artifacts-out:"
          ls -R artifacts-out/

      - name: "Upload Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}-${{ strategy.job-index }}
          path: artifacts-out/*
          if-no-files-found: warn

  publish-release:
    needs: build-tauri
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Download all artifacts"
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: "release-assets-*"
          merge-multiple: true

      - name: "Create or Update GitHub Release"
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          name: "CanbanVoimaxHarness ${{ github.ref_name }}"
          body: "Release ${{ github.ref_name }}"
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "all-artifacts/**/*"
          artifactErrorsFailBuild: false
          replacesArtifacts: true
          makeLatest: legacy
